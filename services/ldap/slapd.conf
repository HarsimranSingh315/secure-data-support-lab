# OpenLDAP directory for the lab: dc=securedata,dc=lab
# Lab-only credentials (documented in README). Never reuse them anywhere real.
include   /etc/openldap/schema/core.schema
include   /etc/openldap/schema/cosine.schema
include   /etc/openldap/schema/inetorgperson.schema
include   /etc/openldap/schema/nis.schema

pidfile   /run/openldap/slapd.pid
argsfile  /run/openldap/slapd.args

modulepath /usr/lib/openldap
moduleload back_mdb.so

# TLS for both StartTLS on 389 and LDAPS on 636
TLSCACertificateFile  /etc/openldap/certs/ca-chain.pem
TLSCertificateFile    /etc/openldap/certs/server.crt
TLSCertificateKeyFile /etc/openldap/certs/server.key
TLSProtocolMin        3.3

# Production habit: never accept a password over an unencrypted connection.
security simple_bind=128

database  mdb
maxsize   104857600
suffix    "dc=securedata,dc=lab"
rootdn    "cn=admin,dc=securedata,dc=lab"
rootpw    {SSHA}kGWtCeZb3WTmuPvGTbAGYPyva4/nNzBH
directory /var/lib/openldap/openldap-data
index     objectClass eq
index     uid,memberUid eq

access to attrs=userPassword
  by self write
  by anonymous auth
  by * none
access to *
  by users read
  by * none
