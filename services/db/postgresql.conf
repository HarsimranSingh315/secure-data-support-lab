# PostgreSQL 16 for the lab: TLS only, LDAP + SCRAM authentication, pgAudit for activity monitoring.
listen_addresses = '*'
port = 5432
max_connections = 50
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# --- TLS ---
ssl = on
ssl_cert_file = '/var/lib/postgresql/certs/server.crt'
ssl_key_file = '/var/lib/postgresql/certs/server.key'
ssl_ca_file = '/var/lib/postgresql/certs/ca-chain.pem'
ssl_min_protocol_version = 'TLSv1.2'

# --- Audit (database activity monitoring feed) ---
shared_preload_libraries = 'pgaudit'
pgaudit.log = 'read, write, ddl, role'
pgaudit.log_catalog = off
pgaudit.log_relation = on
pgaudit.log_parameter = off

# --- Logging: CSV for the DAM watcher, plain text for humans, same directory ---
logging_collector = on
log_destination = 'csvlog,stderr'
log_directory = '/var/log/postgresql/lab'
log_filename = 'postgresql.log'
log_file_mode = 0644
log_rotation_age = 0
log_rotation_size = 0
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d from %h '
