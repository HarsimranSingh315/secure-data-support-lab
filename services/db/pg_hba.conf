# Who may connect, from where, and how they prove who they are. First match wins.
# TYPE   DATABASE  USER         ADDRESS          METHOD
local    all       postgres                      peer
local    all       all                           scram-sha-256

# The application service account, only from the app server, password (SCRAM) over TLS.
hostssl  appdb     svc_app      10.20.20.30/32   scram-sha-256

# People log in with their directory (LDAP) password over TLS, from Site A only.
# ldaptls=1 = StartTLS to the directory; the directory's certificate must be trusted (LDAPTLS_CACERT).
hostssl  appdb     +ldap_users  10.10.10.0/24    ldap ldapserver=ldap.site-a.lab ldapport=389 ldaptls=1 ldapprefix="uid=" ldapsuffix=",ou=people,dc=securedata,dc=lab"

# Everything else, including any non-TLS attempt, is refused.
host     all       all          0.0.0.0/0        reject
