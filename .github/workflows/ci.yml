name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell lint
        run: shellcheck scripts/*.sh services/*/*.sh services/common/lab-route
      - name: Unit tests (DAM watcher, app + mock KMS)
        run: |
          python3 -m pip install --quiet pytest "psycopg[binary]"
          python3 -m pytest -q services/dam/tests services/app/tests
      - name: Workbench backend tests
        run: |
          python3 -m pip install --quiet -r workbench/backend/requirements-dev.txt
          cd workbench/backend && python3 -m pytest -q tests
      - name: Import as the container does (code at /srv/app)
        run: |
          sudo mkdir -p /srv && sudo cp -r workbench/backend/app /srv/app
          cd /srv && WB_REPO="$GITHUB_WORKSPACE" WB_STATIC=/nonexistent python3 -c "import app.main; assert app.main.app"
      - name: PKI builds a valid chain
        run: |
          CERTS_DIR=$RUNNER_TEMP/certs ./scripts/pki.sh init
          openssl verify -CAfile $RUNNER_TEMP/certs/ca-chain.pem $RUNNER_TEMP/certs/db/leaf.crt
      - name: Compose file is valid
        run: |
          mkdir -p certs secrets && touch certs/ca-chain.pem
          docker compose config -q

  workbench-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workbench/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    # Builds and starts the full lab, then checks routing, firewall, TLS, LDAP login, KMS and DAM.
    needs: [lint-and-unit, workbench-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the lab
        run: make up
      - name: Seed data through the app (KMS encryption path)
        run: make seed
      - name: Checks
        run: |
          set -x
          docker compose exec -T r1 vtysh -c "show ip ospf neighbor" | grep -c Full | grep -q 2
          docker compose exec -T toolbox curl -sf --cacert /lab-certs/ca-chain.pem https://app.site-b.lab:8443/health
          docker compose exec -T toolbox bash -lc "PGPASSWORD='Lab-alice-2026!' psql 'host=db.site-b.lab dbname=appdb user=alice sslmode=verify-full sslrootcert=/lab-certs/ca-chain.pem' -Atc 'select count(*) from cardholders'" | grep -q 3
      - name: Workbench reports the healthy lab, then a sealed KMS
        run: |
          wb() { curl -sf --cacert certs/ca-chain.pem "https://localhost:9443/api/overview?refresh=true"; }
          for i in $(seq 1 30); do wb >/dev/null && break; sleep 2; done
          wb | jq '{overall, counts}'
          wb | jq -e '.overall == "ok"' || { wb | jq '.checks[] | select(.status != "ok") | {id, status, summary, evidence}'; exit 1; }
          ./scripts/scenario.sh break kms-sealed
          wb | jq -e '(.checks[] | select(.id == "kms") | .status) == "down"'
          ./scripts/scenario.sh fix kms-sealed
          wb | jq -e '(.checks[] | select(.id == "kms") | .status) == "ok"'
      - name: Workbench map and guided diagnosis on the real lab
        run: |
          api() { curl -sf --cacert certs/ca-chain.pem "https://localhost:9443$1"; }
          api "/api/topology?refresh=true" | jq '{path: .path.summary, links: [.links[] | {id, status}]}'
          api "/api/topology?refresh=true" | jq -e '.path.reached and (.path.links | index("r1_r2")) and ([.links[].status] | all(. == "ok"))'
          api "/api/diagnose?target=db&port=5432" | jq -e '.verdict == "pass"'
          ./scripts/scenario.sh break firewall-drop
          api "/api/diagnose?target=db&port=5432" | jq -e '.layer == "Firewall (port filtered)"'
          ./scripts/scenario.sh fix firewall-drop
          ./scripts/scenario.sh break core-link-down
          sleep 12
          api "/api/topology?refresh=true" | jq -e '.path.uses_backup and ([.links[] | select(.id == "r1_r2") | .status] == ["down"])'
          ./scripts/scenario.sh fix core-link-down
      - name: Workbench incidents and packet capture (runs scenario.sh inside the workbench)
        run: |
          api()  { curl -sf --cacert certs/ca-chain.pem "https://localhost:9443$1"; }
          post() { curl -sf --cacert certs/ca-chain.pem -X POST -H "X-Workbench-Action: 1" -H "Content-Type: application/json" "https://localhost:9443$1" ${2:+-d "$2"}; }
          # the guard: no header, no action
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/ca-chain.pem -X POST https://localhost:9443/api/incidents/firewall-drop/break)" = 403
          post /api/incidents/firewall-drop/break | jq -e '.state == "active" and .ticket_id == "INC-2103" and .reveal == null'
          post /api/captures '{"point":"r3","filter":"db","seconds":6,"traffic":"db"}' | tee /tmp/cap.json | jq '{packets: .meta.packets, findings: [.findings[] | .title]}'
          jq -e '.findings[0].severity == "fail" and (.findings[0].title | startswith("No reply to connection attempts"))' /tmp/cap.json
          post /api/incidents/firewall-drop/fix | jq -e '.state == "resolved" and (.reveal | startswith("Firewall"))'
          api "/api/diagnose?target=db&port=5432" | jq -e '.verdict == "pass"'
          api /api/actions | jq -e 'length >= 2'
      - name: Workbench identity, database access, login tests, audit and alerts
        run: |
          api()  { curl -sf --cacert certs/ca-chain.pem "https://localhost:9443$1"; }
          post() { curl -sf --cacert certs/ca-chain.pem -X POST -H "X-Workbench-Action: 1" -H "Content-Type: application/json" "https://localhost:9443$1" -d "$2"; }
          api /api/identity/directory | jq -e '([.users[].uid] | sort) == ["alice","bob","carol"] and (tostring | test("SSHA") | not)'
          post /api/identity/login-test '{"kind":"db","user":"bob","mode":"correct"}' | jq -e '.status == "pass"'
          post /api/identity/login-test '{"kind":"ldap","user":"bob","mode":"no_tls"}' | jq -e '.summary | startswith("Confidentiality required")'
          api /api/database/access | jq -e '[.matrix[] | select(.table == "cardholders" and .privilege == "SELECT") | .user] | index("bob")'
          post /api/incidents/data-exfiltration/break '' | jq -e '.state == "active"'
          sleep 5
          api /api/alerts | jq -e '[.alerts[].rule] | index("bulk-read-sensitive")'
          api "/api/audit?kind=audit&user=bob" | jq -e '[.events[].object] | index("public.cardholders")'
          post /api/incidents/data-exfiltration/fix '' | jq -e '.state == "resolved"'
          api /api/database/access | jq -e '[.matrix[] | select(.table == "cardholders" and .privilege == "SELECT") | .user] | index("bob") | not'
      - name: Scenario round-trips
        run: |
          for s in firewall-drop kms-sealed data-exfiltration; do
            ./scripts/scenario.sh break $s
            sleep 5
            ./scripts/scenario.sh fix $s
          done
          sleep 5
          make alerts | grep -q bulk-read-sensitive
      - name: Support bundle
        if: always()
        run: make bundle || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-bundle
          path: bundles/*.tar.gz
